<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Gym v1.0</title>
<style>
:root{
  --bg:#000000;--c1:#121212;--c2:#1A1A1A;--c3:#2B2B2B;
  --cyan:#FFFFFF;--cbg:rgba(255,255,255,.08);--cbr:rgba(255,255,255,.22);
  --amb:#B0B0B0;--abg:rgba(176,176,176,.12);--abr:rgba(176,176,176,.28);
  --txt:#FFFFFF;--mut:#9A9A9A;--dim:#5C5C5C;
  --grn:#7DCF8A;--gbg:rgba(125,207,138,.12);--gbr:rgba(125,207,138,.28);
  --red:#E05A63;--rbg:rgba(224,90,99,.14);--rbr:rgba(224,90,99,.32);
  --gold:#E8E8E8;--purple:#8A8A8A
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%,rgba(255,255,255,.06) 0%,transparent 55%),
    linear-gradient(180deg,#0A0A0A 0%,#000000 45%,#000000 100%);
  background-attachment:fixed;
  color:var(--txt);font-family:"IBM Plex Sans",-apple-system,sans-serif;font-size:15px;max-width:480px;margin:0 auto;padding-bottom:90px;min-height:100vh
}
/* HEADER */
.hdr{padding:16px 16px 12px;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--c3)}
.hdr-toprow{display:flex;justify-content:space-between;align-items:center}
.vtag{font-size:10px;color:var(--dim);background:var(--c2);border:1px solid var(--c3);border-radius:20px;padding:2px 9px;font-weight:700;letter-spacing:.5px}
.ht{font-size:24px;font-family:"Barlow",sans-serif;font-weight:900;color:var(--txt);letter-spacing:.04em;text-transform:uppercase}
.hs{font-size:13px;color:var(--mut);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.mrow{display:flex;gap:6px;margin-top:10px}
.met{flex:1;background:var(--c1);border:1px solid var(--c3);border-radius:14px;padding:9px 6px;text-align:center;position:relative;overflow:hidden}
.met::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.mv{font-size:18px;font-family:"Barlow",sans-serif;font-weight:800;color:var(--txt)}
.hdricon{font-size:14px;opacity:.7;vertical-align:1px}
.mv.warn{color:var(--amb)}
.ml{font-size:10px;color:var(--mut);margin-top:1px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
/* TABS */
.tabs{display:flex;background:rgba(18,18,18,.96);border-bottom:1px solid var(--c3);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:14px 18px;border:none;background:transparent;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:"IBM Plex Sans",sans-serif;border-bottom:2px solid transparent;flex-shrink:0;transition:color .2s;letter-spacing:.06em;text-transform:uppercase}
.tab.on{color:var(--txt);border-bottom-color:var(--txt)}
.pnl{padding:14px;display:none}
.pnl.on{display:block}
/* CARDS */
.card{background:var(--c1);border:1px solid var(--c3);border-radius:16px;padding:16px;margin-bottom:12px}
.card.gym{border-color:var(--cbr);box-shadow:0 0 24px rgba(255,255,255,.04)}
.card.success{border-color:var(--gbr)}
.card.warm{border-color:var(--abr)}
.card.danger{border-color:var(--rbr)}
.card.cyan{border-color:var(--cbr);background:linear-gradient(135deg,var(--c1),rgba(255,255,255,.03))}
.cl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:700}
.ct{font-size:17px;font-weight:700;font-family:"Barlow",sans-serif}
.cs{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.5}
.sep{height:1px;background:var(--c3);margin:12px 0}
/* BADGES + NOTICES */
.pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block}
.pg{background:var(--gbg);color:var(--grn)}.pa{background:var(--abg);color:var(--amb)}.pr{background:var(--rbg);color:var(--red)}.pi{background:var(--cbg);color:var(--cyan)}.pd{background:var(--c2);color:var(--mut)}
.pill-pr{background:linear-gradient(90deg,rgba(255,255,255,.08),var(--cbg));color:var(--gold);border:1px solid rgba(255,255,255,.28);font-size:12px;padding:4px 12px;font-family:"Barlow",sans-serif;font-weight:800}
.nt{border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-top:10px;line-height:1.5}
.ng{background:var(--gbg);color:var(--grn)}.na{background:var(--abg);color:var(--amb)}.nr{background:var(--rbg);color:var(--red)}.ni{background:var(--cbg);color:var(--cyan)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
/* SESSION HEADER */
.sess-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--c3)}
.sess-timer{font-family:"Barlow",sans-serif;font-size:22px;font-weight:800;color:var(--cyan)}
/* SECTION DIVIDERS */
.sect-div{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
.sect-lbl{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.sect-lbl.must{color:var(--cyan)}.sect-lbl.opt{color:var(--dim)}
.sect-line{flex:1;height:1px;background:var(--c3)}
/* EXERCISES */
.exb{background:var(--c1);border:1px solid var(--c3);border-radius:16px;padding:16px;margin-bottom:12px}
.exb:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.exhd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.exn{font-size:18px;font-weight:700;font-family:"Barlow",sans-serif;line-height:1.2}
.exn.done{color:var(--grn)}
.subbed{font-size:10px;color:var(--amb);margin-top:2px;font-weight:700}
.infobtn{background:none;border:none;color:var(--dim);font-size:15px;padding:0 0 0 4px;cursor:pointer;vertical-align:middle}
.infobtn:hover{color:var(--cyan)}
.exinfo{background:var(--c2);border:1px solid var(--c3);border-radius:10px;padding:10px 12px;margin:8px 0}
.ext{font-size:12px;color:var(--mut);margin-top:3px}
.wlbl{font-size:10px;color:var(--cyan);margin-top:2px;font-weight:600}
.exlast{font-size:12px;color:var(--cyan);text-align:right;flex-shrink:0;max-width:120px;line-height:1.5}
.exsugg{font-size:12px;color:var(--amb);text-align:right;margin-top:3px;font-weight:700}
/* SET ROWS */
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--c3)}
.srow:last-child{border-bottom:none}
.srow.setdone{background:rgba(0,230,118,.05);border-radius:10px;padding:8px 6px}
.srow.droprow{background:rgba(245,166,35,.07);border-radius:10px;padding:8px 6px}
.snum{font-size:12px;color:var(--dim);width:22px;text-align:center;flex-shrink:0;font-weight:700;font-family:"Barlow",sans-serif}
.setdel{background:none;border:none;color:var(--dim);font-size:11px;padding:2px;margin-top:3px;cursor:pointer;display:block;width:100%}
.dbadge{font-size:9px;font-weight:800;color:var(--amb);background:var(--abg);padding:1px 5px;border-radius:4px;display:block;text-align:center}
.nin{width:62px;padding:11px 6px;border:1px solid var(--c3);border-radius:10px;font-size:20px;font-weight:800;font-family:"Barlow",sans-serif;background:var(--c2);color:var(--txt);text-align:center;-webkit-appearance:none;transition:border-color .2s}
.nin:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px var(--cbg)}
.nin:disabled{opacity:.25}
.nin-lbl{font-size:10px;color:var(--mut);text-align:center;margin-top:2px;font-weight:600}
.tx{font-size:15px;color:var(--dim);font-weight:700}
.dbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--c3);background:var(--c2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;color:var(--mut);transition:all .2s}
.dbtn.dk{background:var(--gbg);border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px rgba(0,230,118,.2)}
/* CHOICE PICKER */
.choice-pick{display:flex;gap:8px;margin-bottom:10px}
.choice-btn{flex:1;padding:12px 8px;border:1px solid var(--c3);border-radius:12px;cursor:pointer;background:var(--c2);color:var(--mut);font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:600;text-align:center;min-height:44px;transition:all .2s}
.choice-btn.chosen{border-color:var(--cyan);background:var(--cbg);color:var(--cyan)}
/* SET CONTROLS */
.set-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ex-del{flex-shrink:0;width:36px;height:36px;border-radius:10px;border:1px solid var(--rbr);background:var(--rbg);color:var(--red);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;line-height:1}
.subbtn{font-size:12px;color:var(--mut);background:var(--c2);border:1px solid var(--c3);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-weight:600;min-height:36px}
.subbtn.danger{color:var(--red);border-color:var(--rbr);background:var(--rbg)}
.addbtn{font-size:12px;color:var(--grn);background:var(--gbg);border:1px solid var(--gbr);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-weight:700}
.dropbtn{font-size:12px;color:var(--amb);background:var(--abg);border:1px solid var(--abr);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-weight:700}
.subpanel{background:var(--c2);border-radius:12px;padding:12px;margin-top:8px;border:1px solid var(--cbr)}
.subopt{display:block;font-size:14px;color:var(--txt);padding:11px 10px;cursor:pointer;background:none;border:none;border-bottom:1px solid var(--c3);width:100%;text-align:left;font-family:"IBM Plex Sans",sans-serif;font-weight:500}
.subopt:last-child{border-bottom:none}
/* REST TIMER */
.rest-timer{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cbg);border-radius:12px;margin:8px 0;border:1px solid var(--cbr)}
.rest-num{font-size:24px;font-weight:800;font-family:"Barlow",sans-serif;color:var(--cyan);min-width:70px}
/* INPUTS */
.genin{width:100%;padding:11px 12px;border:1px solid var(--c3);border-radius:10px;font-size:14px;background:var(--c1);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;transition:border-color .2s}
.genin::placeholder{color:var(--dim)}
.genin:focus{outline:none;border-color:var(--cyan)}
textarea.genin{resize:none}
/* BUTTONS */
.btn{padding:15px 16px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;width:100%;margin-top:10px;display:block;text-align:center;transition:opacity .2s,transform .1s}
.btn-amb{background:var(--txt);color:#000}.btn-cyan{background:var(--txt);color:#000}
.btn-ghost{background:var(--c2);color:var(--txt);border:1px solid var(--c3)}
.btn-grn{background:var(--gbg);color:var(--grn);border:1px solid var(--gbr)}
.btn-sm{padding:10px 14px;font-size:13px;margin-top:6px}
.btn:active{opacity:.85;transform:scale(.98)}
/* STICKY SAVE */
.sticky-wrap{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 28px);z-index:100;display:none}
.sticky-save{background:var(--txt);color:#000;border:none;border-radius:999px;font-size:15px;font-weight:900;font-family:"Barlow",sans-serif;cursor:pointer;width:100%;padding:18px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 28px rgba(255,255,255,.18)}
.sticky-save:active{transform:scale(.97)}
/* CONFBOX + SKIP */
.confbox{background:var(--gbg);color:var(--grn);border:1px solid var(--gbr);border-radius:14px;padding:14px;font-size:15px;font-weight:700;text-align:center;display:none;margin-top:10px}
.skipsheet{background:var(--c2);border-radius:16px;padding:16px;margin-top:10px;border:1px solid var(--c3);display:none}
.skipopt{display:block;width:100%;padding:15px;margin-bottom:8px;border:1px solid var(--c3);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;background:var(--c1);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;text-align:left}
.skipopt:last-child{margin-bottom:0}
/* PROGRESS */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pstat{background:var(--c1);border:1px solid var(--c3);border-radius:14px;padding:14px;text-align:center}
.pval{font-size:28px;font-weight:900;font-family:"Barlow",sans-serif;color:var(--txt)}
.plbl{font-size:11px;color:var(--mut);margin-top:3px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.prog-bar{background:var(--c2);border-radius:4px;height:6px;margin:5px 0;overflow:hidden}
.prog-fill{height:6px;border-radius:4px;transition:width .4s ease}
.statrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--c3);gap:8px}
.statrow:last-child{border-bottom:none}
.sinput{padding:9px;border:1px solid var(--c3);border-radius:9px;font-size:14px;background:var(--c2);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;transition:border-color .2s}
.sinput:focus{outline:none;border-color:var(--cyan)}
.hitem{padding:10px 0;border-bottom:1px solid var(--c3)}
.hitem:last-child{border-bottom:none}
/* FOOD */
.foodsel{width:100%;padding:12px;border:1px solid var(--c3);border-radius:12px;font-size:14px;background:var(--c2);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;margin-bottom:8px;-webkit-appearance:none}
.foodsel:focus{outline:none;border-color:var(--cyan)}
.macrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--c3);font-size:14px}
.macrow:last-child{border-bottom:none}
.macval{font-weight:700;color:var(--cyan);font-family:"Barlow",sans-serif;font-size:16px}
.seg{display:flex;background:var(--c2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.segb{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:var(--mut);font-family:"IBM Plex Sans",sans-serif;white-space:nowrap;transition:color .2s}
.segb.on{background:var(--c1);color:var(--txt);box-shadow:0 0 12px rgba(255,255,255,.06)}
/* MEAL TABLE */
.meal-group{margin-bottom:14px}
.meal-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--c2);border-radius:10px;margin-bottom:6px;cursor:pointer}
.meal-hd-name{font-size:12px;font-weight:800;color:var(--txt);letter-spacing:1px;text-transform:uppercase}
.meal-hd-totals{font-size:12px;color:var(--mut);font-weight:600}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid var(--c3);gap:8px}
.meal-item:last-child{border-bottom:none}
.meal-item-name{font-size:13px;font-weight:600}
.meal-item-meta{font-size:11px;color:var(--mut);margin-top:2px}
.meal-add{display:flex;gap:8px;align-items:center;margin-top:6px;padding:6px 0}
/* PLATE BUILDER */
.plate-comp{background:var(--c2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--c3)}
.plate-comp-lbl{font-size:10px;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.plate-row{display:flex;gap:8px;align-items:center}
.plate-total{background:var(--cbg);border:1px solid var(--cbr);border-radius:12px;padding:14px;margin-top:10px;text-align:center}
/* WATER */
.water-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.water-count{font-size:32px;font-weight:900;font-family:"Barlow",sans-serif;color:var(--cyan);margin:0 12px;min-width:44px;text-align:center}
.water-count.full{color:var(--grn)}
.water-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--c3);background:var(--c2);color:var(--txt);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
/* SYMPTOM */
.sym-val-btn{flex:1;padding:10px 4px;border:1px solid var(--c3);border-radius:10px;font-size:16px;font-weight:800;font-family:"Barlow",sans-serif;cursor:pointer;background:var(--c2);color:var(--mut);text-align:center;min-height:44px;transition:all .15s}
/* AD-HOC / SESSION PICKER */
.sess-option{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;border:1px solid var(--c3);border-radius:14px;cursor:pointer;background:var(--c1);transition:border-color .2s}
.free-ex-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--c3);cursor:pointer;font-size:14px}
.free-ex-row:last-child{border-bottom:none}
.sess-option:last-child{margin-bottom:0}
.sess-option:active{border-color:var(--cyan)}
.sess-option.suggested{border-color:var(--cbr);background:rgba(255,255,255,.03)}
/* MEASUREMENTS */
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.meas-stat{background:var(--c2);border-radius:10px;padding:10px;text-align:center}
.meas-val{font-size:20px;font-weight:800;font-family:"Barlow",sans-serif;color:var(--cyan)}
.meas-lbl{font-size:10px;color:var(--mut);margin-top:2px;font-weight:600}
.warn-banner{background:var(--rbg);color:var(--red);padding:11px;font-size:13px;font-weight:700;text-align:center;display:none}
/* HISTORY */
.hist-ex-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--c3);gap:8px}
.hist-ex-row:last-child{border-bottom:none}
.hist-date{font-size:13px;font-weight:600;color:var(--txt);min-width:90px}
.hist-best{font-size:14px;font-weight:800;font-family:"Barlow",sans-serif;color:var(--cyan)}
.hist-pr{font-size:10px;color:var(--gold);font-weight:800;margin-left:6px}
.day-strip{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.day-pill{flex-shrink:0;width:40px;text-align:center;cursor:pointer;border-radius:10px;padding:6px 4px;border:1px solid var(--c3);background:var(--c1);transition:all .2s}
.day-pill.hit{border-color:var(--gbr);background:var(--gbg)}
.day-pill.miss{border-color:var(--rbr);background:var(--rbg)}
.day-pill.part{border-color:var(--abr);background:var(--abg)}
.day-pill-name{font-size:9px;color:var(--mut);font-weight:700;text-transform:uppercase}
.day-pill-val{font-size:13px;font-weight:800;font-family:"Barlow",sans-serif;margin-top:2px}
.ex-search{width:100%;padding:12px;border:1px solid var(--c3);border-radius:12px;font-size:14px;background:var(--c2);color:var(--txt);font-family:"IBM Plex Sans",sans-serif;margin-bottom:8px}
.ex-search:focus{outline:none;border-color:var(--cyan)}
.chart-wrap{background:var(--c2);border-radius:12px;padding:12px;margin-top:8px}
.chart-label{font-size:10px;color:var(--mut);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.lift-chart-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lift-chart-row .foodsel{flex:1;min-width:140px;margin-bottom:0}
.lift-chart-meta{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.4}
.profile-hero{display:flex;gap:12px;align-items:center;margin-bottom:12px}
</style>
</head>
<body>
<div id="warn-banner" class="warn-banner">Private mode detected &#x2014; data will NOT be saved</div>
<div class="hdr">
  <div class="hdr-toprow">
    <div class="ht">Gym</div>
    <div class="vtag" title="build 2026-08-31">v1.0</div>
  </div>

/* ===== BODY DIAGRAM (body-muscles library integration) =====
   Maps our existing muscle tag taxonomy onto the library's real region IDs.
   Library splits every region by left/right; ours doesn't, so both sides always
   get the same value. A few mappings are honest approximations, not exact 1:1 matches,
   since the library's regional split doesn't perfectly mirror ours everywhere \u2014

  'Lats':['lats-upper-left','lats-upper-right','lats-mid-left','lats-mid-right','lats-lower-left','lats-lower-right'],
  'Mid-back':['lats-upper-left','lats-upper-right','traps-lower-left','traps-lower-right'], /* approximation: no distinct rhomboid region */

  'Core':['abs-upper-left','abs-upper-right','abs-lower-left','abs-lower-right'], /* approximation: stabilizer work, no distinct library region */

function volumeToBodyState(volumeList){
  const maxVol=volumeList.length?Math.max(...volumeList.map(v=>v.volume)):1;
  const state={};
  volumeList.forEach(v=>{
    const ids=MUSCLE_TAG_TO_LIB_IDS[v.muscle];
    if(!ids)return;
    const ratio=v.volume/maxVol;
    const intensity=Math.min(10,Math.max(1,Math.round(ratio*10)));
    ids.forEach(id=>{state[id]={intensity,selected:false};});
  });
  return state;
}
function freshnessToBodyState(freshnessList){
  const state={};
  freshnessList.forEach(f=>{
    const ids=MUSCLE_TAG_TO_LIB_IDS[f.muscle];
    if(!ids)return;
    /* Inverted: freshness 0 (just trained) -> intensity 10 (deep red, "still recovering").
       freshness 1 (fully recovered) -> intensity 0 (neutral grey, nothing to flag). */
    const intensity=Math.round((1-f.freshness)*10);
    ids.forEach(id=>{state[id]={intensity,selected:false};});
  });
  return state;
}
/* Reverse lookup, built once: library region ID -> our tag name(s). */
const LIB_ID_TO_TAGS={};
Object.entries(MUSCLE_TAG_TO_LIB_IDS).forEach(([tag,ids])=>{
  ids.forEach(id=>{(LIB_ID_TO_TAGS[id]=LIB_ID_TO_TAGS[id]||[]).push(tag);});
});
/* Real bug fix: some library regions map to more than one app tag (e.g. plain 'Triceps'
   AND the more specific 'Triceps (long head)' both resolve to the same region, since the
   generic tag exists only for exercises that mention it as a minor secondary effect).
   Tapping that region always used to just take the first tag in the array, which could be
   the generic one even when zero exercises actually use it as their real target \u2014 showing
   an empty, useless exercise list. This picks whichever candidate tag has at least one real
   primary exercise, falling back to the first candidate only if none do. */
const TAGS_WITH_PRIMARY_USE=new Set(
  Object.keys(MUSCLE_TAG_TO_LIB_IDS).filter(tag=>DAYS.some(d=>d.ex.some(e=>(e.primaryMuscles||[]).includes(tag))))
);
function resolveClickedTag(id){
  const tags=LIB_ID_TO_TAGS[id]||[];
  return tags.find(t=>TAGS_WITH_PRIMARY_USE.has(t))||tags[0];
}
/* The real fix: some regions (biceps long head vs brachialis, chest vs lower chest) are
   drawn as the exact same shape in the underlying anatomy library \u2014 there's no way to
   tell which one was tapped. Picking a single "winner" tag permanently hides the other
   muscle's real exercises. This returns every candidate tag that has at least one real
   exercise attached, primary-having tags first, so the UI can show all of them clearly
   labeled instead of silently discarding one. */
function resolveClickedTagsAll(id){
  const tags=LIB_ID_TO_TAGS[id]||[];
  const withPrimary=tags.filter(t=>TAGS_WITH_PRIMARY_USE.has(t));
  const rest=tags.filter(t=>!TAGS_WITH_PRIMARY_USE.has(t)&&getExercisesForMuscleTag(t).length>0);
  const ordered=[...withPrimary,...rest];
  return ordered.length?ordered:(tags.length?[tags[0]]:[]);
}
function getExercisesForMuscleTag(tag){
  return getFreeSessionExerciseList().filter(e=>
    (e.primaryMuscles||[]).includes(tag)||(e.secondaryMuscles||[]).includes(tag)
  );
}

/* ===== DATA LAYER (first slice \u2014 PR/session/draft access only, existing call sites not yet migrated) =====
   This exists so the next migration pass has a single, tested, correct place to point every
   old lsG/lsS call at, instead of each call site inventing its own key-naming convention.
   Every method here mirrors exactly what the scattered inline calls already do today, so
   swapping a call site to use this later is a safe, behavior-identical change, not a rewrite. */
const Data={
  pr:{
    get(name){return lsG('pr:'+name);},
    set(name,best){return lsS('pr:'+name,{w:best.w,r:best.r,date:activeDateKey()});},
    clearAll(){
      for(let i=localStorage.length-1;i>=0;i--){
        const k=localStorage.key(i);
        if(k&&k.startsWith('pr:'))localStorage.removeItem(k);
      }
    }
  },
  session:{
    get(dateKey){return lsG('sess:'+(dateKey||todayKey()));},
    set(session,dateKey){return lsS('sess:'+(dateKey||todayKey()),session);},
    delete(dateKey){return lsDel('sess:'+(dateKey||todayKey()));},
    getLast(dl){return lsG('last:'+dl);},
    setLast(dl,data){return lsS('last:'+dl,data);}
  },
  draft:{
    save(dl,state){const dk=activeDateKey();return lsS('ws_draft:'+dk,{dl,state,date:dk});},
    findAny(){
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&k.startsWith('ws_draft:')){
          const d=lsG(k);
          if(d&&d.dl&&d.state)return d;
        }
      }
      return null;
    },
    clearAll(){
      for(let i=localStorage.length-1;i>=0;i--){
        const k=localStorage.key(i);
        if(k&&k.startsWith('ws_draft:'))localStorage.removeItem(k);
      }
    }
  }
};

function getSmoothedWeight(stats){
  const withWt=(stats||[]).filter(s=>s.wt);
  if(!withWt.length)return null;
  const last3=withWt.slice(-3);
  const avg=last3.reduce((s,e)=>s+parseFloat(e.wt),0)/last3.length;
  return{value:avg,smoothed:last3.length>1,entriesUsed:last3.length};
}

  const stats=lsG('bstats')||[];

/* ===== COACH NAMESPACE ===== */
/* Pure logic, zero DOM access. v2.3's coaching cards call into this; nothing here renders anything. */
const Coach={
  getDailyStatus(dateKey){
    dateKey=dateKey||todayKey();
    const t=getProfile().targets;
    const log=lsG('food:'+dateKey)||[];
    const p=log.reduce((s,i)=>s+(i.p||0),0),k=log.reduce((s,i)=>s+(i.k||0),0),
          c=log.reduce((s,i)=>s+(i.c||0),0),f=log.reduce((s,i)=>s+(i.f||0),0);
    return{
      proteinGap:Math.max(0,t.protein-p),kcalGap:Math.max(0,t.kcal-k),
      carbsGap:Math.max(0,t.carbs-c),fatGap:Math.max(0,t.fat-f),
      onTrack:p>=t.protein&&k<=t.kcal*1.1
    };
  },
  getWeeklyStatus(){
    const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
    const entries=Object.entries(mergedMlog()).filter(([k])=>k>=cutoff).map(e=>e[1]);
    const done=entries.filter(e=>e.type==='done').length;
    let pSum=0,kSum=0,days=0;
    for(let i=0;i<7;i++){
      const d=new Date();d.setDate(d.getDate()-i);
      const dk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      const log=lsG('food:'+dk);if(!log||!log.length)continue;
      pSum+=log.reduce((s,i)=>s+(i.p||0),0);kSum+=log.reduce((s,i)=>s+(i.k||0),0);days++;
    }
    return{sessionsDone:done,avgProtein:days?Math.round(pSum/days):0,avgKcal:days?Math.round(kSum/days):0,daysLogged:days};
  },
  get3SessionTrend(exerciseName){
    const hist=getExHistory(exerciseName).slice(-3);
    if(!hist.length)return{available:false};
    const best=hist.reduce((b,h)=>{
      if(!h.best)return b;
      const w=parseFloat(h.best.w)||0;
      return(!b||w>parseFloat(b.w||0))?h.best:b;
    },null);
    return{available:true,sessionsUsed:hist.length,bestOfLast3:best,mostRecent:hist[hist.length-1].best,improving:hist.length>=2&&parseFloat(hist[hist.length-1].best?.w||0)>=parseFloat(hist[0].best?.w||0)};
  },
  getSessionFeedback(session){
    if(!session||!session.totalVolume)return{available:false};
    const prevSess=Data.session.getLast(session.dl);
    const prevVol=prevSess?.exercises?.reduce((v,e)=>v+(e.exVolume||0),0)||0;
    return{available:true,volume:session.totalVolume,prevVolume:prevVol,trend:prevVol?(session.totalVolume>=prevVol?'up':'down'):'first'};
  },
  getWeeklyMuscleVolume(){
    const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
    const sets={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||!k.startsWith('sess:'))continue;
      const sess=lsG(k);
      if(!sess||sess.skipped||!sess.exercises||sess.date<cutoff)continue;
      sess.exercises.forEach(e=>{
        const def=findExDef(e.origName);
        if(!def)return;
        const completedSets=(e.sets||[]).filter(s=>s.done&&!s.isDrop).length;
        if(!completedSets)return;
        (def.primaryMuscles||[]).forEach(m=>{sets[m]=(sets[m]||0)+completedSets;});
        (def.secondaryMuscles||[]).forEach(m=>{sets[m]=(sets[m]||0)+completedSets*0.5;});
      });
    }
    return Object.entries(sets).map(([muscle,volume])=>({muscle,volume:Math.round(volume*10)/10})).sort((a,b)=>b.volume-a.volume);
  },
  /* Real freshness: recency weighted by how hard that specific session was relative to this
     muscle's own recent normal, not just a flat days-since-trained count. A heavier-than-usual
     session needs more recovery time than a light one at the same day count. */
  getMuscleFreshness(){
    const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-60);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
    const history={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||!k.startsWith('sess:'))continue;
      const sess=lsG(k);
      if(!sess||sess.skipped||!sess.exercises||sess.date<cutoff)continue;
      sess.exercises.forEach(e=>{
        const def=findExDef(e.origName);
        if(!def)return;
        const v=e.exVolume||0;
        const add=(m,mult)=>{(history[m]=history[m]||[]).push({date:sess.date,contribution:v*mult});};
        (def.primaryMuscles||[]).forEach(m=>add(m,1));
        (def.secondaryMuscles||[]).forEach(m=>add(m,0.5));
      });
    }
    const today=new Date();
    return Object.entries(history).map(([muscle,entries])=>{
      entries.sort((a,b)=>a.date.localeCompare(b.date));
      const last=entries[entries.length-1];
      const daysSince=Math.max(0,Math.floor((today-new Date(last.date))/86400000));
      const trailing=entries.slice(-4);
      const avg=trailing.reduce((s,e)=>s+e.contribution,0)/trailing.length;
      const ratio=avg>0?last.contribution/avg:1;
      const recoveryWindow=Math.min(6,Math.max(1.5,3*ratio));
      const freshness=Math.min(1,Math.max(0,daysSince/recoveryWindow));
      return{muscle,daysSince,freshness,lastDate:last.date};
    }).sort((a,b)=>a.freshness-b.freshness);
  },
  /* Deload/overreaching signal: reuses the freshness calculation above rather than a
     separate metric. If a genuine majority of currently-tracked muscles are simultaneously
     showing meaningful fatigue relative to their own normal (not just one muscle fresh from
     yesterday's session), that's a real system-wide signal worth surfacing \u2014 not a single
     sore muscle, a broad pattern across the whole week's training. Honestly gated on having
     enough muscles with real history to say anything at all. */
  getDeloadSignal(){
    const fresh=this.getMuscleFreshness();
    if(fresh.length<4)return{available:false,reason:'Not enough muscles with recent training history yet to say anything real.'};
    const fatigued=fresh.filter(f=>f.freshness<0.3);
    const ratio=fatigued.length/fresh.length;
    return{
      available:true,
      totalMuscles:fresh.length,
      fatiguedCount:fatigued.length,
      fatiguedMuscles:fatigued.map(f=>f.muscle),
      suggestDeload:ratio>=0.5,
      ratioPercent:Math.round(ratio*100)
    };
  }
};

function getSuggestion(orig,best,prKey){
  if(!best||!best.w)return orig.noweight?'Log to get targets':'No data yet \u2014 log this session';
  if(orig.inputType==='seconds'){
    const pr=prKey?Data.pr.get(prKey):null;
    if(pr&&parseFloat(best.w)<parseFloat(pr.w))return 'Work back to PR: '+pr.w+'s (this session: '+best.w+'s)';
    return 'Add 5s next session (was '+best.w+'s)';
  }
  if(orig.inputType==='reps_each')return 'Add 1 rep per side (was '+best.w+' each side)';
  if(orig.noweight&&orig.r==='Max reps'){
    const pr=prKey?Data.pr.get(prKey):null;
    if(pr&&parseInt(best.r||0)<parseInt(pr.r||0))return 'Work back to PR: '+pr.r+' reps (got '+best.r+' today)';
    return 'Beat '+best.r+' reps \u2014 add 1 per week';
  }
  const w=parseFloat(best.w),r=parseInt(best.r);
  const pr=prKey?Data.pr.get(prKey):null;
  if(pr&&w<parseFloat(pr.w))return 'Work back to PR: '+parseFloat(pr.w).toFixed(1)+'kg (was '+w+'kg today)';
  if(orig.compound!==false){
    const{recW}=getNextTargetWeight(orig,prKey||'',w,r);
    return recW>w?'Last top set: '+w+'kg \u00d7 '+r+' \u2014 try '+recW.toFixed(1)+'kg for today\u2019s top set':'Last top set: '+w+'kg \u00d7 '+r+' \u2014 hold '+w+'kg, aim for a clean rep';
  }
  const inc=1.0;
  if(orig.r.includes('\u2013')){
    const[lo,hi]=orig.r.split('\u2013').map(Number);
    if(r>=hi)return 'Increase to '+(w+inc).toFixed(1)+'kg \u2014 maxed '+hi+' reps';
    if(r>=(lo+hi)/2)return 'Hold '+w+'kg \u2014 push for '+hi+' reps';
    return 'Hold '+w+'kg \u2014 hit '+lo+' reps first';
  }
  const target=parseInt(orig.r)||r;
  return r>=target?'Increase to '+(w+inc).toFixed(1)+'kg':'Hold '+w+'kg \u2014 aim for '+target+' reps';
}

/* ===== PR DETECTION ===== */
function checkPR(origName,best,inputType){
  if(!best)return false;
  const cur=Data.pr.get(origName);
  const isRepsFirst=inputType==='bodyweight';
  const isTimeFirst=inputType==='seconds';
  if(isRepsFirst){
    if(!best.r||parseInt(best.r)<=0)return false;
    const bw=parseFloat(best.w||0),br=parseInt(best.r||0);
    const cw=cur?parseFloat(cur.w||0):0,cr=cur?parseInt(cur.r||0):0;
    if(!cur||br>cr||bw>cw){Data.pr.set(origName,{w:best.w||'0',r:best.r});return true;}
    return false;
  }
  if(!best.w||parseFloat(best.w)<=0)return false;
  if(isTimeFirst){
    const bw=parseFloat(best.w),cw=cur?parseFloat(cur.w||0):0;
    if(!cur||bw>cw){Data.pr.set(origName,{w:best.w,r:best.r});return true;}
    return false;
  }
  if(!cur||parseFloat(best.w)>parseFloat(cur.w)||(parseFloat(best.w)===parseFloat(cur.w)&&parseInt(best.r||0)>parseInt(cur.r||0))){
    Data.pr.set(origName,{w:best.w,r:best.r});return true;
  }
  return false;
}

/* ===== SAVE SESSION ===== */
function setHasData(st,inputType){
  if(!st)return false;
  if(inputType==='seconds'||inputType==='reps_each')return !!(st.w&&parseFloat(st.w)>0);
  if(inputType==='bodyweight')return !!(st.r&&parseInt(st.r)>0);
  return !!(st.w&&st.r&&parseFloat(st.w)>0);
}
function markFilledSetsDone(s,gd){
  if(!s||!gd)return 0;
  let n=0;
  s.ex.forEach((ex,ei)=>{
    const orig=gd.ex[ei]||{};
    const chosenOpt=orig.inputType==='choice'&&ex.chosenType?orig.choiceOptions?.find(o=>o.name===ex.chosenType):null;
    const subOverride=(!chosenOpt&&ex.name!==ex.origName)?SUB_TYPE_OVERRIDE[ex.name]:null;
    const effType=chosenOpt?chosenOpt.inputType:(subOverride?subOverride.inputType:(orig.inputType||'weight'));
    (ex.sets||[]).forEach(st=>{
      if(setHasData(st,effType)){st.done=true;n++;}
      else if(!st.isDrop)st.done=false;
    });
  });
  return n;
}


function bestSetOf(workingSets,inputType){
  const singleField=inputType==='seconds'||inputType==='reps_each';
  const repsFirst=inputType==='bodyweight';
  const metric=st=>repsFirst?parseInt(st.r||0):parseFloat(st.w||0);
  return workingSets.reduce((b,st)=>{
    const valid=singleField?(st.w&&parseFloat(st.w)>0):repsFirst?(st.r&&parseInt(st.r)>0):(st.w&&st.r&&parseFloat(st.w)>0);
    if(valid&&(!b||metric(st)>metric(b)))return{w:st.w,r:st.r};
    return b;
  },null);
}
function saveSession(dl,seqIdx){
  const gd=DAYS[seqIdx]||adHocDay||DAYS.find(d=>d.label===dl);
  const s=WS[dl];if(!s||!gd)return;
  const filled=markFilledSetsDone(s,gd);
  const newPRs=[];
  /* End-of-day logging: no live timer required. Assume ~2.5 min per working set (set + 2–3 min rest). */
  const duration=s.startAt?Math.round((Date.now()-s.startAt)/60000):(filled?Math.max(1,Math.round(filled*2.5)):null);
  const exercises=s.ex.map((ex,ei)=>{
    const orig=gd.ex[ei]||gd.ex[0];
    const isChoiceEx=orig.inputType==='choice';
    const chosenOpt=isChoiceEx&&ex.chosenType?orig.choiceOptions?.find(o=>o.name===ex.chosenType):null;
    const subOverride=(!chosenOpt&&ex.name!==ex.origName)?SUB_TYPE_OVERRIDE[ex.name]:null;
    const effOrig=chosenOpt?{...orig,...chosenOpt,noweight:true}:(subOverride?{...orig,...subOverride}:orig);
    const effName=chosenOpt?ex.chosenType:ex.name;
    const effOrigName=chosenOpt?ex.chosenType:ex.origName;
    const workingSets=ex.sets.filter(st=>!st.isDrop);
    const best=bestSetOf(workingSets,effOrig.inputType);
    const isPR=checkPR(effName,best,effOrig.inputType);
    if(isPR)newPRs.push(effName);
    const exVolume=workingSets.reduce((v,st)=>{
      if(effOrig.inputType==='bodyweight')return v+(parseInt(st.r)||0);
      if(effOrig.inputType==='seconds')return v+(parseFloat(st.w)||0);
      if(effOrig.inputType==='reps_each')return v+(parseInt(st.r)||0)*2;
      return v+(parseFloat(st.w)||0)*(parseInt(st.r)||0);
    },0);
    return{name:effName,origName:effOrigName,best,sets:ex.sets,chosenType:ex.chosenType,suggestion:getSuggestion(effOrig,best,effName),isPR,inputType:effOrig.inputType,exVolume};
  });
  const totalVolume=exercises.reduce((v,e)=>v+(e.exVolume||0),0);
  const isFree=seqIdx==='free';
  const dk=activeDateKey();
  const session={date:dk,dl,seqIdx:isFree?null:seqIdx,exercises,note:s.note,painNote:s.painNote||'',skipped:false,duration,newPRs,totalVolume};
  Data.session.set(session,dk);
  Data.session.setLast(dl,{date:dk,exercises});
  /* Only advance the Push/Pull/Legs/Cardio sequence when logging for today. */
  if(!isFree&&isLoggingToday())lsS('last_seq_idx',seqIdx);
  lsS('last_dl',dl);
  const mk=monthKeyFor(dk);
  const mlog=lsG('mlog:'+mk)||{};
  mlog[dk]={type:'done',dl,seqIdx:isFree?undefined:seqIdx};
  lsS('mlog:'+mk,mlog);
  clearDraft();showStickyBtn(false);stopTimerTick();
  renderToday();
  const toast=document.getElementById('save-toast');
  if(toast){
    const prTxt=newPRs.length?' &#x2605; NEW PR: '+newPRs.join(', ')+'!':'';
    const when=isLoggingToday()?'':' for '+fmtLogDateLabel(dk);
    toast.innerHTML='&#x2713; Session saved'+when+(duration?' ('+duration+' min)':'')+'.'+prTxt;
    toast.style.display='block';
    setTimeout(()=>{toast.style.display='none';},3000);
  }
}

function deleteSession(){
  const dk=activeDateKey();
  const ex=Data.session.get(dk);

async function exchangeStravaToken(body){
  const res=await fetch('https://www.strava.com/oauth/token',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data?.message||data?.error||('Token exchange failed ('+res.status+')'));
  return data;
}
async function ensureStravaAccessToken(){
  const a=getStravaAuth();
  if(!a?.clientId||!a?.clientSecret)throw new Error('Connect Strava below first (Client ID + Secret + Connect).');
  if(!a.refreshToken&&!a.accessToken)throw new Error('Connect Strava below first.');
  const skew=120000;
  if(a.accessToken&&a.expiresAt&&Date.now()<a.expiresAt-skew)return a.accessToken;
  if(!a.refreshToken)throw new Error('Strava session expired — reconnect below.');
  const data=await exchangeStravaToken({
    client_id:a.clientId,
    client_secret:a.clientSecret,
    grant_type:'refresh_token',
    refresh_token:a.refreshToken
  });
  saveStravaAuth({
    ...a,
    accessToken:data.access_token,
    refreshToken:data.refresh_token||a.refreshToken,
    expiresAt:Date.now()+(data.expires_in||21600)*1000,
    athleteId:data.athlete?.id||a.athleteId
  });
  return data.access_token;
}
async function handleStravaOAuthReturn(){
  const params=new URLSearchParams(location.search);
  const code=params.get('code');
  const err=params.get('error');
  if(!code&&!err)return;
  history.replaceState({},'',location.pathname+location.hash);
  if(err){alert('Strava connect was cancelled.');return;}
  const a=getStravaAuth();
  if(!a?.clientId||!a?.clientSecret){alert('Save Client ID and Secret in Progress, then Connect again.');return;}
  try{
    const data=await exchangeStravaToken({
      client_id:a.clientId,
      client_secret:a.clientSecret,
      code,
      grant_type:'authorization_code'
    });
    saveStravaAuth({
      ...a,
      accessToken:data.access_token,
      refreshToken:data.refresh_token,
      expiresAt:Date.now()+(data.expires_in||21600)*1000,
      athleteId:data.athlete?.id||null,
      connectedAt:new Date().toISOString()
    });
    alert('Strava connected. On your next Cardio day, paste an activity link to autofill.');
  }catch(e){
    alert('Strava connect failed: '+(e.message||e));
  }
}

/* ACSM running equation (gross):
   VO2 ml/kg/min = 0.2*S + 0.9*S*G + 3.5
   S = speed m/min, G = grade as decimal (elev gain / distance).
   kcal = VO2 * bodyMassKg / 1000 * 5 * minutes
   Body fat is not in ACSM directly — we use total body weight (standard). Lean mass is shown for context. */
function estimateRunCalories({km,mins,elevGainM,weightKg}){
  km=parseFloat(km)||0;mins=parseFloat(mins)||0;elevGainM=parseFloat(elevGainM)||0;weightKg=parseFloat(weightKg)||0;
  if(km<=0||mins<=0||weightKg<=0)return{available:false,reason:!weightKg?'Log your body weight in Progress or Profile first':'Need distance, moving time, and body weight'};
  const distM=km*1000;
  const speedMPerMin=distM/mins; /* m/min */
  const grade=Math.max(0,elevGainM)/distM; /* fractional; downhill not modelled by ACSM */
  const vo2=0.2*speedMPerMin+0.9*speedMPerMin*grade+3.5;
  const kcalPerMin=vo2*weightKg/1000*5;
  const gross=Math.round(kcalPerMin*mins);
  const net=Math.round(Math.max(0,(vo2-3.5)*weightKg/1000*5*mins));
  const ruleOfThumb=Math.round(km*weightKg*1.036); /* ~1 kcal/kg/km common heuristic */
  return{
    available:true,
    grossKcal:gross,
    netKcal:net,
    ruleOfThumbKcal:ruleOfThumb,
    vo2:Math.round(vo2*10)/10,
    speedKmH:Math.round((km/(mins/60))*100)/100,
    gradePct:Math.round(grade*1000)/10,
    formula:'ACSM running VO\u2082'
  };
}
function paceFromKmMins(km,mins){
  km=parseFloat(km);mins=parseFloat(mins);
  if(!(km>0&&mins>0))return null;
  return Math.round((mins/km)*100)/100;
}
function fmtPace(minPerKm){
  if(minPerKm==null||!(minPerKm>0))return'\u2014';
  const m=Math.floor(minPerKm);
  const s=Math.round((minPerKm-m)*60);
  return m+':'+String(s).padStart(2,'0')+'/km';
}
function readRunFormFields(){

}

  const duration=run.mins!=null?Math.round(run.mins):null;

    run.km!=null?run.km+' km':null,
    run.mins!=null?run.mins+' min':null,
    run.paceMinPerKm!=null?fmtPace(run.paceMinPerKm):null,
    run.calories!=null?run.calories+' kcal':null
  ].filter(Boolean).join(' · ');
  const exercises=[{
    name:'Outdoor run / Strava',
    origName:'Steady cardio',
    best:run.mins!=null?{w:String(run.mins),r:''}:null,
    sets:[{w:String(run.mins||''),r:'',done:true,isDrop:false}],
    suggestion:summary||'Strava cardio logged',
    isPR:false,
    inputType:'seconds',
    exVolume:parseFloat(run.mins)||0
  }];
  const noteEl=document.getElementById('run-session-note');
  const sessionNote=(noteEl?.value||run.note||'').trim();
  const session={date:dk,dl,seqIdx:seqIdx===undefined||seqIdx===null?3:seqIdx,exercises,note:sessionNote,painNote:'',skipped:false,duration,newPRs:[],totalVolume:exercises[0].exVolume,cardio:true};
  Data.session.set(session,dk);
  Data.session.setLast(dl,{date:dk,exercises});
  if(isLoggingToday())lsS('last_seq_idx',session.seqIdx);
  lsS('last_dl',dl);
  const mk=monthKeyFor(dk);
  const mlog=lsG('mlog:'+mk)||{};
  mlog[dk]={type:'done',dl,seqIdx:session.seqIdx};
  lsS('mlog:'+mk,mlog);
  clearDraft();showStickyBtn(false);stopTimerTick();
  adHocDay=null;adHocSeqIdx=null;
  renderToday();
  const toast=document.getElementById('save-toast');
  if(toast){
    const when=isLoggingToday()?'':' for '+fmtLogDateLabel(dk);
    toast.innerHTML='&#x2713; Cardio day saved'+when+(duration?' ('+duration+' min)':'')+(run.calories!=null?' · '+run.calories+' kcal':'')+'.';
    toast.style.display='block';
    setTimeout(()=>{toast.style.display='none';},3000);
  }
}

    <div class="cl">Logging for</div>

        <div style="font-size:12px;color:var(--cyan);margin-top:3px;font-weight:600">${e.suggestion||''}</div>
      </div>`).join('')}`:`${existing.exercises?.[0]?.suggestion?`<div style="font-size:13px;color:var(--cyan);font-weight:600;margin-bottom:8px">${existing.exercises[0].suggestion}</div>`:''}`}

        <button class="btn btn-ghost btn-sm" style="flex:1;margin-top:0" onclick="editSession()">&#x270F; Edit session</button>

      </div>
    </div>`;
    showStickyBtn(false);
  }
  /* -- Skipped -- */
  else if(existing&&existing.skipped){
    html+=`<div class="card"><div class="ct" style="margin-bottom:8px">Skipped \u2014 ${existing.dl}</div>

function startSession(dayIndex){
  if(dayIndex===-1){_forcePickerOnce=true;adHocDay=null;adHocSeqIdx=null;renderToday();return;}
  _forcePickerOnce=false;
  adHocDay=DAYS[dayIndex];adHocSeqIdx=dayIndex;
  initWS(adHocDay.label,adHocDay);
  renderToday();
}
function startFreeSession(){
  _forcePickerOnce=false;
  adHocDay={label:'Free session',focus:'Your combo today',time:'',ex:[]};
  adHocSeqIdx=null;
  WS['Free session']={ex:[],subOpen:null,note:'',painNote:'',startAt:Date.now(),lastSetAt:null};
  _freeExPickerMode='search';_freeExSelectedTags=[];
  saveDraft('Free session');
  renderToday();
}
function getFreeSessionExerciseList(){
  const seen=new Set();const list=[];
  for(const d of DAYS){for(const e of d.ex){
    if(e.inputType==='choice'&&e.choiceOptions){
      for(const o of e.choiceOptions){
        if(!seen.has(o.name)){seen.add(o.name);list.push({...e,...o,n:o.name});}
      }
    }else if(!seen.has(e.n)){seen.add(e.n);list.push(e);}
  }}
  for(const origName in SUBS){
    for(const subName of SUBS[origName]){
      if(seen.has(subName))continue;
      seen.add(subName);
      const def=findExDef(subName);
      if(def)list.push(def);
    }
  }
  return list.sort((a,b)=>a.n.localeCompare(b.n));
}
function addToFreeSession(name){
  if(!adHocDay||adHocDay.label!=='Free session')return;
  const def=getFreeSessionExerciseList().find(e=>e.n===name);
  if(!def)return;
  adHocDay.ex.push({...def,priority:'normal'});
  const pSubs=lsG('persisted_subs')||{};
  const trackN=pSubs[def.n]||def.n;
  const prefill=getPrefillSets(def,trackN,def.s||3);
  WS['Free session'].ex.push({
    name:trackN,origName:def.n,chosenType:null,
    sets:Array.from({length:def.s||3},(_,si)=>({w:prefill?.[si]?.w||'',r:prefill?.[si]?.r||'',done:false,isDrop:false}))
  });
  saveDraft('Free session');
  renderToday();
}
function filterFreeExList(q){
  const query=q.toLowerCase();
  document.querySelectorAll('.free-ex-row').forEach(row=>{
    row.style.display=row.dataset.name.includes(query)?'flex':'none';
  });
}
function removeFromFreeSession(ei){
  if(!adHocDay||adHocDay.label!=='Free session')return;
  const name=WS['Free session']?.ex?.[ei]?.name||adHocDay.ex[ei]?.n||'this exercise';
  if(!confirm('Remove "'+name+'" from today\'s session?'))return;
  adHocDay.ex.splice(ei,1);
  if(WS['Free session']){
    WS['Free session'].ex.splice(ei,1);
    if(WS['Free session'].subOpen===ei)WS['Free session'].subOpen=null;
    if(WS['Free session'].infoOpen===ei)WS['Free session'].infoOpen=null;
    if(typeof WS['Free session'].subOpen==='number'&&WS['Free session'].subOpen>ei)WS['Free session'].subOpen--;
    if(typeof WS['Free session'].infoOpen==='number'&&WS['Free session'].infoOpen>ei)WS['Free session'].infoOpen--;
  }
  saveDraft('Free session');
  renderToday();
}

function getLiftChartExercises(dayLabel){
  const day=DAYS.find(d=>d.label===dayLabel);
  if(!day)return[];
  const names=[];
  day.ex.forEach(e=>{
    if(e.inputType==='choice'&&e.choiceOptions){
      e.choiceOptions.forEach(o=>{
        if(o.inputType!=='seconds')names.push(o.name);
      });
    }else if(e.inputType!=='seconds'){
      names.push(e.n);
    }
    (SUBS[e.n]||[]).forEach(s=>{
      const def=findExDef(s);
      if(!def||def.inputType!=='seconds')names.push(s);
    });
  });
  return[...new Set(names)];
}
function sessionAvgLoad(ex){
  if(!ex)return null;
  const itype=ex.inputType||'weight';
  const sets=(ex.sets||[]).filter(s=>!s.isDrop);
  if(itype==='seconds')return null;
  if(itype==='bodyweight'){
    const reps=sets.map(s=>parseInt(s.r)||0).filter(r=>r>0);
    if(reps.length)return{avg:Math.round(reps.reduce((a,b)=>a+b,0)/reps.length*10)/10,unit:'reps',metric:'Avg reps'};
    if(ex.best&&ex.best.r)return{avg:parseFloat(ex.best.r),unit:'reps',metric:'Best reps'};
    return null;
  }
  if(itype==='reps_each'){
    const reps=sets.map(s=>parseInt(s.r)||parseInt(s.w)||0).filter(r=>r>0);
    if(reps.length)return{avg:Math.round(reps.reduce((a,b)=>a+b,0)/reps.length*10)/10,unit:'/side',metric:'Avg reps/side'};
    if(ex.best&&(ex.best.r||ex.best.w))return{avg:parseFloat(ex.best.r||ex.best.w),unit:'/side',metric:'Best reps/side'};
    return null;
  }
  /* Volume-weighted average weight across working sets: Σ(w×r) / Σ(r) */
  let tw=0,tr=0;
  const plain=[];
  sets.forEach(s=>{
    const w=parseFloat(s.w)||0,r=parseInt(s.r)||0;
    if(w<=0)return;
    if(r>0){tw+=w*r;tr+=r;}
    else plain.push(w);
  });
  if(tr>0)return{avg:Math.round((tw/tr)*10)/10,unit:'kg',metric:'Avg weight'};
  if(plain.length)return{avg:Math.round((plain.reduce((a,b)=>a+b,0)/plain.length)*10)/10,unit:'kg',metric:'Avg weight'};
  if(ex.best&&parseFloat(ex.best.w)>0)return{avg:parseFloat(ex.best.w),unit:'kg',metric:'Best weight'};
  return null;
}
function weekStartKey(dateStr){
  const d=new Date(dateStr+'T12:00:00');

  d.setDate(d.getDate()-day);

}

function monthBucketLabel(ym){

function getExAvgLoadHistory(exerciseName){
  const results=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('sess:'))continue;
    const sess=lsG(k);
    if(!sess||sess.skipped||!sess.exercises||sess.cardio)continue;
    const ex=sess.exercises.find(e=>e.name===exerciseName||e.origName===exerciseName);
    if(!ex)continue;
    const load=sessionAvgLoad(ex);
    if(!load)continue;
    results.push({date:sess.date,avg:load.avg,unit:load.unit,metric:load.metric,isPR:!!ex.isPR});
  }
  return results.sort((a,b)=>a.date.localeCompare(b.date));
}
function dayBucketLabel(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function aggregateLiftHistory(history,range){
  if(!history.length)return{points:[],unit:'kg',metric:'Avg weight'};
  const unit=history[history.length-1].unit;
  const metric=history[history.length-1].metric;
  if(range==='day'){
    const sorted=[...history].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const sliced=sorted.slice(-40);
    const points=sliced.map(h=>({
      y:Math.round(h.avg*10)/10,
      date:h.date,
      label:dayBucketLabel(h.date),
      pr:!!h.isPR
    }));
    return{points,unit,metric};
  }
  const buckets={};
  history.forEach(h=>{
    const key=range==='month'?h.date.slice(0,7):weekStartKey(h.date);
    if(!buckets[key])buckets[key]={sum:0,n:0,pr:false,date:key};
    buckets[key].sum+=h.avg;
    buckets[key].n+=1;
    if(h.isPR)buckets[key].pr=true;
  });
  const keys=Object.keys(buckets).sort();
  const maxBuckets=range==='month'?18:16;
  const sliced=keys.slice(-maxBuckets);
  const points=sliced.map(key=>{
    const b=buckets[key];
    return{
      y:Math.round((b.sum/b.n)*10)/10,
      date:key,
      label:range==='month'?monthBucketLabel(key):weekBucketLabel(key),
      pr:b.pr
    };
  });
  return{points,unit,metric};
}
function buildLiftChartInner(dayKey){
  const dayLabel=LIFT_CHART_DAYS[dayKey];
  const opts=getLiftChartExercises(dayLabel);
  const st=_liftChartState[dayKey];
  if(!opts.length)return'<div style="color:var(--dim);font-size:13px;padding:16px;text-align:center">No exercises in this category</div>';
  if(!st.ex||!opts.includes(st.ex))st.ex=opts[0];
  const hist=getExAvgLoadHistory(st.ex);
  const agg=aggregateLiftHistory(hist,st.range||'week');
  if(agg.points.length<2){
    return`<div style="color:var(--dim);font-size:13px;padding:20px;text-align:center">${hist.length?`Need at least 2 ${st.range==='month'?'months':'weeks'} of logs for ${escHtml(st.ex)}`:`Log ${escHtml(st.ex)} at least twice to see a trend`}</div>
      <div class="lift-chart-meta">${agg.metric} · ${st.range==='month'?'Monthly':'Weekly'} average · ${hist.length} session${hist.length===1?'':'s'} logged</div>`;
  }
  const last=agg.points[agg.points.length-1];
  const first=agg.points[0];
  const delta=Math.round((last.y-first.y)*10)/10;
  const deltaTxt=delta>0?`+${delta}`:String(delta);
  return`<div class="chart-wrap"><div class="chart-label">${agg.metric} (${agg.unit})</div>${buildSVG(agg.points,'var(--cyan)',agg.unit)}</div>
    <div class="lift-chart-meta">Latest ${last.y}${agg.unit} · change over range ${deltaTxt}${agg.unit} · ${hist.length} sessions · ${st.range==='month'?'monthly':'weekly'} buckets</div>`;
}
function refreshLiftChart(dayKey){
  const el=document.getElementById('lift-chart-'+dayKey);if(!el)return;
  el.innerHTML=buildLiftChartInner(dayKey);
}
function onLiftChartExChange(dayKey,value){

function onLiftChartRangeChange(dayKey,value){

}

function getBodyMetricHistory(metric){
  const stats=lsG('bstats')||[];
  return stats
    .filter(s=>s[metric]!=null&&s[metric]!==''&&!Number.isNaN(parseFloat(s[metric])))
    .map(s=>({date:s.date,avg:parseFloat(s[metric])}))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function buildBodyStatsChartInner(){
  const metric=_bodyChartState.metric||'wt';
  const range=_bodyChartState.range||'week';
  const hist=getBodyMetricHistory(metric);
  const unit=metric==='bf'?'%':'kg';
  const label=metric==='bf'?'Body fat':'Weight';
  const asHist=hist.map(h=>({date:h.date,avg:h.avg,unit,metric:label,isPR:false}));
  const agg=aggregateLiftHistory(asHist,range);
  if(agg.points.length<2){
    return`<div style="color:var(--dim);font-size:13px;padding:20px;text-align:center">${hist.length?`Need at least 2 ${range==='month'?'months':(range==='day'?'days':'weeks')} of ${label.toLowerCase()} logs`:`Log ${label.toLowerCase()} at least twice to see a trend`}</div>
      <div class="lift-chart-meta">${hist.length} log${hist.length===1?'':'s'} · ${range} view</div>`;
  }
  const last=agg.points[agg.points.length-1],first=agg.points[0];
  const delta=Math.round((last.y-first.y)*10)/10;
  return`<div class="chart-wrap"><div class="chart-label">${label} (${unit})</div>${buildSVG(agg.points,metric==='bf'?'var(--amb)':'var(--cyan)',unit)}</div>
    <div class="lift-chart-meta">Latest ${last.y}${unit} · change ${delta>0?'+':''}${delta}${unit} · ${hist.length} logs · by ${range}</div>`;
}
function refreshBodyStatsChart(){
  const el=document.getElementById('body-comp-chart');if(!el)return;
  el.innerHTML=buildBodyStatsChartInner();
}

function saveStats(){
  const date=(document.getElementById('st_date')?.value||todayKey());
  if(date>todayKey()){alert('Cannot log body stats in the future.');return;}
  const entry={date};
  ['wt','bf','mm','bw'].forEach(f=>{const v=document.getElementById('st_'+f)?.value;if(v!==''&&v!=null)entry[f]=parseFloat(v);});
  if(entry.wt==null&&entry.bf==null){alert('Enter at least weight or body fat.');return;}
  if(entry.wt!=null&&entry.bf!=null)entry.fm=Math.round(entry.wt*entry.bf/100*10)/10;
  if(entry.bw!=null)entry.bwUnit='kg';
  let all=lsG('bstats')||[];
  const idx=all.findIndex(s=>s.date===date);
  if(idx>=0)all[idx]={...all[idx],...entry};
  else all.push(entry);
  all.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  lsS('bstats',all.slice(-400));
  updateHeader();
  const c=document.getElementById('stconf');
  if(c){c.style.display='block';setTimeout(()=>{c.style.display='none';renderProgress();},1200);}
  else renderProgress();
}
function saveMeasurements(){
  const entry={date:todayKey()};
  const map={mw:'waist',mc:'chest',mla:'lArm',mra:'rArm'};
  Object.entries(map).forEach(([id,key])=>{const v=document.getElementById(id)?.value;if(v)entry[key]=parseFloat(v);});
  if(!entry.waist&&!entry.chest)return;
  const all=lsG('measurements')||[];all.push(entry);lsS('measurements',all.slice(-260));
  const c=document.getElementById('mconf');if(c){c.style.display='block';setTimeout(()=>{c.style.display='none';renderProgress();},2000);}
}

function rangeBucketWord(range){
  return range==='month'?'months':(range==='day'?'days':'weeks');
}
function buildProfileBodyChartInner(metric){
  const range=_profileBodyCharts[metric]||'week';
  const hist=getBodyMetricHistory(metric);
  const unit=metric==='bf'?'%':'kg';
  const label=metric==='bf'?'Body fat':'Weight';
  const asHist=hist.map(h=>({date:h.date,avg:h.avg,unit,metric:label,isPR:false}));
  const agg=aggregateLiftHistory(asHist,range);
  const need=2;
  if(agg.points.length<need){
    return`<div style="color:var(--dim);font-size:13px;padding:20px;text-align:center">${hist.length?`Need at least 2 ${rangeBucketWord(range)} of ${label.toLowerCase()} logs`:`Log ${label.toLowerCase()} at least twice to see a trend`}</div>
      <div class="lift-chart-meta">${hist.length} log${hist.length===1?'':'s'} · ${range} view</div>`;
  }

function allFoods(){const c=lsG('custom_foods')||[];return[...FOODS,...c.map(f=>({...f,cat:'My foods'}))];}
function foodOptsHtml(){
  const cats={};allFoods().forEach(f=>{if(!cats[f.cat])cats[f.cat]=[];cats[f.cat].push(f);});
  return Object.entries(cats).map(([cat,items])=>`<optgroup label="${cat}">${items.map(f=>`<option value="${f.name}">${f.name}${f.lbl?' ('+f.lbl+')':''}</option>`).join('')}</optgroup>`).join('');
}
/* Unit-aware amount handling. 'g' and 'ml' foods are entered as a direct amount
   (prefilled to the food's typical serving, editable). 'piece'/'tsp'/'scoop' foods
   are entered as a count (prefilled to 1, editable), and typ on that food record
   stores grams-per-unit so the count can be converted into real macros. */
const COUNT_UNITS={piece:'pieces',tsp:'tsp',scoop:'scoops'};
function isCountUnit(u){return!!COUNT_UNITS[u];}
function unitWord(u){return COUNT_UNITS[u]||u||'g';}
function defaultAmt(food){return isCountUnit(food.unit)?1:(food.typ||100);}
function amtFieldLabel(food){return isCountUnit(food.unit)?'Quantity ('+unitWord(food.unit)+')':'Amount ('+(food.unit||'g')+')';}
function foodMacros(food,amt){
  if(!food||!amt)return{k:0,p:0,c:0,f:0};
  const grams=isCountUnit(food.unit)?amt*(food.typ||100):amt;
  return{k:food.per100.k*grams/100,p:food.per100.p*grams/100,c:food.per100.c*grams/100,f:food.per100.f*grams/100};
}

function renderMealGroups(log){
  if(!log.length)return`<div style="font-size:14px;color:var(--dim);text-align:center;padding:16px">No meals logged yet</div>`;
  const groups={};
  MEAL_TYPES.forEach(m=>groups[m]=[]);
  groups['Other']=[];
  log.forEach((item,i)=>{
    const g=MEAL_TYPES.includes(item.mealType)?item.mealType:'Other';
    groups[g].push({...item,i});
  });
  let html='';
  [...MEAL_TYPES,'Other'].forEach(mealType=>{
    const items=groups[mealType];
    if(!items.length)return;
    const mK=Math.round(items.reduce((s,i)=>s+(i.k||0),0));
    const mP=Math.round(items.reduce((s,i)=>s+(i.p||0),0));
    html+=`<div class="meal-group">
      <div class="meal-hd">
        <div class="meal-hd-name">${mealType}</div>
        <div class="meal-hd-totals">${mK} kcal &middot; ${mP}g protein</div>
      </div>
      ${items.map(item=>`<div class="meal-item">
        <div style="flex:1">
          <div class="meal-item-name">${item.name}</div>
          <div class="meal-item-meta">${item.amt?item.amt+' '+(item.unit||'g')+' &middot; ':''} ${Math.round(item.k||0)} kcal &middot; ${Math.round(item.p||0)}g${item.time?' &middot; '+item.time:''}</div>
        </div>
        <button onclick="removeMeal(${item.i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:22px;padding:6px;min-width:44px;min-height:44px">&times;</button>
      </div>`).join('')}
    </div>`;
  });
  return html;
}

function computePlate(){
  const foods=allFoods();
  const components=[{id:'base',amtId:'pc-base-amt'},{id:'liq',amtId:'pc-liq-amt'},{id:'pro',amtId:'pc-pro-amt'},{id:'side',amtId:'pc-side-amt'}];
  let totalK=0,totalP=0,totalC=0,totalF=0,names=[];const breakdown=[];
  components.forEach(c=>{
    const sel=document.getElementById('pc-'+c.id);const amt=parseFloat(document.getElementById(c.amtId)?.value)||0;
    if(!sel||!sel.value||!amt)return;
    const food=foods.find(f=>f.name===sel.value);if(!food)return;
    const m=foodMacros(food,amt);
    totalK+=m.k;totalP+=m.p;totalC+=m.c;totalF+=m.f;names.push(food.name);
    const unitTxt=isCountUnit(food.unit)?(amt+' '+unitWord(food.unit)):(amt+(food.unit||'g'));
    breakdown.push(`<div class="macrow"><span style="color:var(--mut)">${food.name} ${unitTxt}</span><span class="macval">${Math.round(m.k)} kcal &middot; ${m.p.toFixed(1)}g</span></div>`);
  });
  return{totalK,totalP,totalC,totalF,names,breakdown};
}
function buildPlate(){
  const r=computePlate();
  const resultEl=document.getElementById('plate-result');if(!resultEl)return;
  if(!r.names.length){resultEl.innerHTML='';return;}
  resultEl.innerHTML=`<div class="plate-total" style="margin-bottom:10px">
    <div style="font-size:11px;color:var(--cyan);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">${curPlateMeal}</div>
    <div style="font-size:28px;font-family:'Barlow',sans-serif;font-weight:900;color:var(--cyan)">${Math.round(r.totalK)} kcal</div>
    <div style="font-size:16px;font-weight:700;color:var(--grn);margin-top:4px">${r.totalP.toFixed(1)}g protein</div>
  </div><div style="background:var(--c2);border-radius:12px;padding:12px">${r.breakdown.join('')}</div>`;
}
function pcPrefill(comp){
  const sel=document.getElementById('pc-'+comp);if(!sel)return;
  const amtEl=document.getElementById('pc-'+comp+'-amt');
  const uEl=document.getElementById('pc-'+comp+'-u');
  if(!sel.value){if(uEl)uEl.textContent='g';buildPlate();return;}
  const food=allFoods().find(f=>f.name===sel.value);if(!food)return;
  if(amtEl)amtEl.value=defaultAmt(food);
  if(uEl)uEl.textContent=isCountUnit(food.unit)?unitWord(food.unit):(food.unit||'g');
  buildPlate();
}
function isSymptomDay(){const sym=lsG('sym:'+todayKey())||{};return !!(sym.energy&&sym.energy<=2);}

function addPlateToLog(){

function buildSVG(points,color,unit){
  if(!points||points.length<2)return'<div style="color:var(--dim);font-size:13px;padding:20px;text-align:center">Need at least 2 entries to show a trend</div>';
  const vals=points.map(p=>p.y);
  const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  const W=320,H=100,pad=8;
  const biol=lsG('biologic_date');
  const px=i=>pad+(i/(points.length-1))*(W-pad*2);
  const py=y=>pad+(H-pad*2)-((y-mn)/range)*(H-pad*2);
  const polyPts=points.map((p,i)=>px(i)+','+py(p.y)).join(' ');
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible">
    <polyline points="${polyPts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${points.map((p,i)=>{
      const x=px(i),y=py(p.y);
      const isPR=p.pr;
      return`<circle cx="${x}" cy="${y}" r="${isPR?5:3}" fill="${isPR?'var(--gold)':color}" stroke="${isPR?color:'none'}" stroke-width="1.5"/>`;
    }).join('')}
    <text x="${pad}" y="${H}" fill="var(--dim)" font-size="9">${points[0].label}</text>
    <text x="${W-pad}" y="${H}" fill="var(--dim)" font-size="9" text-anchor="end">${points[points.length-1].label}</text>
    <text x="${pad}" y="11" fill="${color}" font-size="10" font-weight="bold">${mx.toFixed(1)}${unit}</text>
    <text x="${pad}" y="${H-10}" fill="${color}" font-size="10">${mn.toFixed(1)}${unit}</text>

    <text x="${(()=>{const idx=points.findIndex(p=>p.date>=biol);return idx>=0?px(idx)+3:px(points.length-1)+3})()}" y="${pad+10}" fill="var(--amb)" font-size="9">Biol.</text>`:''}

}

function getExHistory(name){
  const results=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('sess:'))continue;
    const sess=lsG(k);
    if(!sess||sess.skipped||!sess.exercises)continue;
    const ex=sess.exercises.find(e=>e.name===name);
    if(!ex||!ex.best||!ex.best.w)continue;
    results.push({date:sess.date,dl:sess.dl,best:ex.best,isPR:ex.isPR||false,suggestion:ex.suggestion||''});
  }
  return results.sort((a,b)=>a.date.localeCompare(b.date));
}
/* e1RM: average of Epley and Brzycki, the two most validated formulas, complementary at
   different rep ranges per the research (Epley better at 6-10+, Brzycki better at 1-6).
   Reliable in the 1-10 rep range; above that the estimate is noted as low-confidence
   rather than silently trusted, since the underlying formulas weren't built for it. */
function estimate1RM(weight,reps){
  const w=parseFloat(weight),r=parseInt(reps);
  if(!w||!r||r<1)return null;
  if(r===1)return{value:w,confidence:'high'};
  const epley=w*(1+r/30);
  const brzycki=r<36?w*36/(37-r):epley;
  return{value:(epley+brzycki)/2,confidence:r<=10?'high':'low'};
}
/* Real trend across the exercise's FULL history \u2014 every session ever logged for it,
   not a recent window. Analyzes everything the app has from when it was first used,
   growing as more sessions get logged, never frozen against a past snapshot. */
function getE1RMTrend(exerciseName){
  const hist=getExHistory(exerciseName);
  const points=hist.map(h=>{
    const est=estimate1RM(h.best.w,h.best.r);
    return est?{date:h.date,e1rm:est.value,confidence:est.confidence}:null;
  }).filter(Boolean);
  if(points.length<2)return{available:false,points,reason:points.length===0?'no history yet':'only one data point so far'};
  const recent=points.slice(-6);
  const first=recent[0],last=recent[recent.length-1];
  const daysSpan=Math.max(1,(new Date(last.date)-new Date(first.date))/86400000);
  const totalChange=last.e1rm-first.e1rm;
  const ratePerWeek=(totalChange/daysSpan)*7;
  return{
    available:true,
    points,
    currentE1RM:Math.round(last.e1rm*10)/10,
    ratePerWeek:Math.round(ratePerWeek*10)/10,
    trending:ratePerWeek>0.5?'up':ratePerWeek<-0.5?'down':'flat',
    lowConfidence:recent.some(p=>p.confidence==='low')
  };
}
/* Reps decline across sets at a FIXED weight (not weight declining \u2014 that's what drop sets
   already do separately). Curve is category-specific: bodyweight fatigues fastest, isolation
   holds up best, compound sits between. */
function getFatigueCurve(orig){
  if(orig.inputType==='bodyweight')return[1,0.65,0.5];
  if(orig.compound!==false)return[1,0.75,0.55];
  return[1,0.85,0.75];
}
/* Ramp to a real top set, then a drop set \u2014 matches the actual method described:
   progressively heavier sets building to a genuine near-max effort (low reps), then one
   backoff/drop set for extra volume. The generator scales to whatever set count is
   configured, always landing the top effort second-to-last (or last, if 2 sets) and the
   drop set truly last when there are 3+ sets. */
function getRampPrefill(topWeight,numSets){
  const round=v=>Math.round(v/0.5)*0.5;
  if(numSets<2)return[{w:String(round(topWeight)),r:'2'}];
  const hasDrop=numSets>=3;
  const rampSteps=hasDrop?numSets-1:numSets;
  return Array.from({length:numSets},(_,i)=>{
    if(hasDrop&&i===numSets-1)return{w:String(round(topWeight*0.55)),r:'9'};
    if(i===rampSteps-1)return{w:String(round(topWeight)),r:'2'};
    const frac=rampSteps<=1?0:i/(rampSteps-1);
    const pct=0.55+frac*0.35,reps=Math.round(12-frac*8);
    return{w:String(round(topWeight*pct)),r:String(Math.max(2,reps))};
  });
}
/* Isolation work: still progressively loaded and still finishes with a burn/drop set, but
   deliberately never chases a 1-2 rep max \u2014 stays in a moderate-to-high rep, genuinely
   close-to-failure zone throughout. Smaller joints and tendons carry a worse risk-to-benefit
   ratio at true near-max singles than compounds do, and hypertrophy tracks with weekly
   close-to-failure volume more reliably than with a strength peak. */
function getModeratePrefill(targetWeight,numSets){
  const round=v=>Math.round(v/0.5)*0.5;
  return Array.from({length:numSets},(_,i)=>{
    const isLast=i===numSets-1;
    if(isLast&&numSets>=3)return{w:String(round(targetWeight*0.65)),r:'14'};
    const frac=numSets<=1?1:i/(numSets-1);
    const pct=0.8+frac*0.2,reps=Math.round(14-frac*4);
    return{w:String(round(targetWeight*pct)),r:String(Math.max(6,reps))};
  });
}
/* The actual prefill dispatcher: real numbers written into set.w/set.r, not just advisory
   text, so accepting with one tap logs the recommended number and overwriting is just
   typing over it. Uses the existing orig.compound field \u2014 already correctly tagged across
   every exercise \u2014 to route compounds through the ramp-to-top-set model and isolation work
   through the moderate, no-1RM-chase model, rather than one flat scheme for everything. */
/* Shared by getPrefillSets and getSuggestion so the advisory text and the actual prefilled
   numbers can never disagree \u2014 both call this same function for the target weight. */
function getNextTargetWeight(orig,trackName,w,r){
  const targetR=orig.r&&orig.r.includes&&orig.r.includes('\u2013')?Number(orig.r.split('\u2013')[1]):(parseInt(orig.r)||r);
  const gotTop=r>=targetR;
  const isCompound=orig.compound!==false;
  let recW=w;
  if(gotTop||isCompound){
    const inc=isCompound?2.5:1.0;
    const trend=getE1RMTrend(trackName);
    if(trend.available&&!trend.lowConfidence&&trend.trending==='up'){
      recW=Math.round((w+Math.max(inc,Math.min(inc*2,trend.ratePerWeek*0.5)))*2)/2;
    }else if(gotTop||isCompound){
      recW=w+inc;
    }
  }
  return{recW,isCompound,gotTop,targetR};
}
/* The actual prefill dispatcher: real numbers written into set.w/set.r, not just advisory
   text, so accepting with one tap logs the recommended number and overwriting is just
   typing over it. Uses the existing orig.compound field \u2014 already correctly tagged across
   every exercise \u2014 to route compounds through the ramp-to-top-set model and isolation work
   through the moderate, no-1RM-chase model, rather than one flat scheme for everything. */
function getPrefillSets(orig,trackName,numSets){
  const hist=getExHistory(trackName);
  const lastBest=hist.length?hist[hist.length-1].best:null;
  if(!lastBest||!lastBest.w||orig.inputType==='seconds'||orig.inputType==='reps_each')return null;
  if(orig.inputType==='bodyweight'){
    const curve=getFatigueCurve(orig),r=parseInt(lastBest.r);
    return Array.from({length:numSets},(_,i)=>{
      const pct=curve[i]!==undefined?curve[i]:curve[curve.length-1];
      return{w:'',r:String(Math.max(1,Math.round(r*pct)))};
    });
  }
  const w=parseFloat(lastBest.w),r=parseInt(lastBest.r);
  const{recW,isCompound}=getNextTargetWeight(orig,trackName,w,r);
  return isCompound?getRampPrefill(recW,numSets):getModeratePrefill(recW,numSets);
}

/* ===== FOOD COACHING ===== */
/* Meal gap: real foods from the actual database that would close today's specific gap,
   not generic "eat more protein" advice. Picks from genuinely protein-efficient foods
   (highest protein per kcal) so the suggestion doesn't just blow the calorie target
   to hit the protein one. Returns real gram amounts for real foods, not portions. */
function getMealGapSuggestion(){
  const log=lsG('food:'+todayKey())||[];
  const t=getProfile().targets;
  const p=log.reduce((s,i)=>s+(i.p||0),0);
  const k=log.reduce((s,i)=>s+(i.k||0),0);
  const proteinGap=t.protein-p;
  const kcalRemaining=t.kcal-k;
  if(proteinGap<8)return{needed:false,proteinGap:Math.round(proteinGap),kcalRemaining:Math.round(kcalRemaining)};
  const ranked=FOODS.map(f=>({...f,proteinPerKcal:f.per100.p/(f.per100.k||1)}))
    .filter(f=>f.per100.p>10)
    .sort((a,b)=>b.proteinPerKcal-a.proteinPerKcal);
  /* Use the food's own real typical serving size, not a back-calculated gram amount \u2014
     that avoided recommending something absurd like 168g of protein powder in one go. */
  const options=ranked.slice(0,3).map(f=>{
    const grams=f.typ||100;
    const protein=Math.round(grams/100*f.per100.p);
    const kcal=Math.round(grams/100*f.per100.k);
    return{name:f.name,grams,protein,kcal,closesGapPercent:Math.min(100,Math.round(protein/proteinGap*100))};
  });
  return{needed:true,proteinGap:Math.round(proteinGap),kcalRemaining:Math.round(kcalRemaining),options};
}
/* Swap suggestions: honestly scoped to protein-per-kcal efficiency, since sugar isn't
   a tracked field in the food database \u2014 not pretending to catch high-sugar items
   specifically, just genuinely inefficient ones (low protein for the calorie cost). */
function getSwapSuggestions(){
  const log=lsG('food:'+todayKey())||[];
  const inefficient=log.filter(item=>{
    const eff=item.k>0?item.p/item.k:1;
    return item.k>=150&&eff<0.08; // meaningful calorie cost, low protein return
  });
  if(!inefficient.length)return[];
  return inefficient.slice(0,3).map(item=>{
    const better=FOODS.filter(f=>f.per100.p/(f.per100.k||1)>0.15).sort((a,b)=>b.per100.p/b.per100.k-a.per100.p/a.per100.k)[0];
    return{logged:item.name,loggedProtein:item.p,loggedKcal:item.k,alternative:better?.name,note:'Higher protein per calorie \u2014 not a sugar comparison, that\u2019s not tracked in the food data yet'};
  });
}
/* Pattern correlation: analyzes every day that has BOTH a food log and a symptom log,
   from whenever the app was first used \u2014 no snapshot, no fixed window. Honestly gated
   on sample size: won't claim a pattern from a handful of days. */
function getFoodSymptomCorrelation(){
  const days=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('food:'))continue;
    const date=k.slice(5);
    const food=lsG(k);
    const sym=lsG('sym:'+date);
    if(!food||!food.length||!sym||!sym.energy)continue;
    const totalP=food.reduce((s,it)=>s+(it.p||0),0);
    days.push({date,protein:totalP,energy:sym.energy});
  }
  if(days.length<10)return{available:false,sampleSize:days.length,reason:'Only '+days.length+' day(s) with both food and symptom logs \u2014 need at least 10 to say anything real.'};
  const sorted=[...days].sort((a,b)=>a.protein-b.protein);
  const median=sorted[Math.floor(sorted.length/2)].protein;
  const lowP=days.filter(d=>d.protein<median),highP=days.filter(d=>d.protein>=median);
  const avg=(arr,key)=>arr.length?Math.round((arr.reduce((s,d)=>s+d[key],0)/arr.length)*10)/10:null;
  return{
    available:true,sampleSize:days.length,
    avgEnergyLowProteinDays:avg(lowP,'energy'),avgEnergyHighProteinDays:avg(highP,'energy'),
    lowProteinDayCount:lowP.length,highProteinDayCount:highP.length
  };
}

function searchExHistory(query){
  const el=document.getElementById('ex-history-result');if(!el||!query.trim())return;
  const q=query.trim().toLowerCase();
  const allNames=new Set();
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('sess:'))continue;
    const sess=lsG(k);
    if(!sess||!sess.exercises)continue;
    sess.exercises.forEach(e=>{if(e.name&&e.name.toLowerCase().includes(q))allNames.add(e.name);if(e.origName&&e.origName.toLowerCase().includes(q))allNames.add(e.origName);});
  }
  if(!allNames.size){el.innerHTML=`<div style="font-size:13px;color:var(--dim);padding:8px">No exercise found matching "${query}"</div>`;return;}
  // Detect inputType from exercise definition
  function getInputType(name){
    for(const d of DAYS){for(const e of d.ex){
      if(e.n===name)return e.inputType||'weight';
      if(e.inputType==='choice'&&e.choiceOptions){const o=e.choiceOptions.find(o=>o.name===name);if(o)return o.inputType;}
    }}return 'weight';
  }
  function getExDef(name,itype){
    for(const d of DAYS){for(const e of d.ex){
      if(e.n===name)return e;
      if(e.inputType==='choice'&&e.choiceOptions){const o=e.choiceOptions.find(o=>o.name===name);if(o)return{...e,...o};}
    }}
    return{inputType:itype,r:'8\u201312',compound:false,noweight:itype==='bodyweight'};
  }
  function fmtBest(best,itype){
    if(!best)return '—';
    if(itype==='bodyweight')return(best.r||0)+' reps';
    if(itype==='seconds')return best.w+'s';
    if(itype==='reps_each')return best.w+' each side';
    return best.w+'kg \u00d7 '+(best.r||0);
  }
  let html='';
  for(const name of allNames){
    const itype=getInputType(name);
    const hist=getExHistory(name);
    if(!hist.length)continue;
    const isRepsFirst=itype==='bodyweight';
    const chartPts=hist.filter(h=>h.best&&(isRepsFirst?h.best.r:h.best.w)).map(h=>({
      y:isRepsFirst?parseInt(h.best.r||0):parseFloat(h.best.w),
      label:h.date.slice(5),date:h.date,pr:h.isPR
    }));
    const chartLabel=itype==='bodyweight'?'Reps per session':itype==='seconds'?'Seconds held':itype==='reps_each'?'Reps per side':'Best weight (kg)';
    const chartUnit=itype==='bodyweight'?'reps':itype==='seconds'?'s':itype==='reps_each'?'/side':'kg';
    const lastBest=hist[hist.length-1]?.best;
    const liveSugg=lastBest?getSuggestion(getExDef(name,itype),lastBest,name):'';
    html+=`<div style="font-size:15px;font-weight:700;font-family:'Barlow',sans-serif;margin-bottom:10px;color:var(--txt)">${name}</div>
    ${chartPts.length>=2?`<div class="chart-wrap"><div class="chart-label">${chartLabel}</div>${buildSVG(chartPts,'var(--cyan)',chartUnit)}<div style="font-size:11px;color:var(--dim);margin-top:4px">&#x25CF; Yellow dots = personal records</div></div>`:''}
    <div style="margin-top:12px">
      ${hist.slice().reverse().map(h=>`<div class="hist-ex-row">
        <div class="hist-date">${h.date}</div>
        <div style="font-size:11px;color:var(--mut)">${h.dl}</div>
        <div class="hist-best">${fmtBest(h.best,itype)}${h.isPR?'<span class="hist-pr">&#x2605; PR</span>':''}</div>
      </div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--cyan);margin-top:10px;font-weight:600">${liveSugg}</div>
    <div class="sep"></div>`;
  }
  el.innerHTML=html||`<div style="font-size:13px;color:var(--dim);padding:8px">No data logged for "${query}" yet</div>`;
}

let _recipePhotoData=null;
function compressImageFile(file,maxW,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read image'));};
    img.src=url;
  });
}
async function onRecipePhotoSelected(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    _recipePhotoData=await compressImageFile(file,900,0.72);
    const prev=document.getElementById('recipe-photo-preview');
    if(prev)prev.innerHTML=`<img src="${_recipePhotoData}" alt="Label preview" style="width:100%;border-radius:12px;border:1px solid var(--c3);margin-top:8px">`;
  }catch(e){alert('Could not load that photo.');_recipePhotoData=null;}
}
function recipeModeChanged(){
  const mode=document.getElementById('rc-mode')?.value||'serving';
  const hint=document.getElementById('rc-mode-hint');
  if(hint)hint.textContent=mode==='per100'
    ?'Enter values exactly as printed per 100g / 100ml.'
    :'Enter values for one serving / one pack, then set the serving weight below.';
  ['rc-k','rc-p','rc-c','rc-f'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    const row=el.closest('.statrow');
    if(!row)return;
    const lbl=row.querySelector('div');
    if(!lbl)return;
    const base=id==='rc-k'?'Calories':id==='rc-p'?'Protein (g)':id==='rc-c'?'Carbs (g)':'Fat (g)';
    lbl.textContent=mode==='per100'?base+' / 100g':base+' / serving';
  });
}
function saveRecipeFromPhoto(){
  const name=(document.getElementById('rc-n')?.value||'').trim();
  const mode=document.getElementById('rc-mode')?.value||'serving';
  const cat=document.getElementById('rc-cat')?.value||'My recipes';
  const unit=document.getElementById('rc-unit')?.value||'g';
  let k=parseFloat(document.getElementById('rc-k')?.value);
  let p=parseFloat(document.getElementById('rc-p')?.value);
  let c=parseFloat(document.getElementById('rc-c')?.value)||0;
  let f=parseFloat(document.getElementById('rc-f')?.value)||0;
  const servingG=parseFloat(document.getElementById('rc-serving')?.value)||100;
  if(!name){alert('Give the recipe a name.');return;}
  if(!k&&k!==0||!p&&p!==0){alert('Enter calories and protein from the label.');return;}
  if(mode==='serving'){
    if(!servingG||servingG<=0){alert('Enter the serving weight in grams (or ml).');return;}
    k=k*100/servingG;p=p*100/servingG;c=c*100/servingG;f=f*100/servingG;
  }
  if(allFoods().find(x=>x.name.toLowerCase()===name.toLowerCase())){
    alert('That name already exists — pick a different name.');return;
  }
  const food={name,cat,per100:{k:Math.round(k*10)/10,p:Math.round(p*10)/10,c:Math.round(c*10)/10,f:Math.round(f*10)/10},typ:mode==='serving'?servingG:100,lbl:'Saved from label photo',fromRecipe:true};
  if(unit!=='g')food.unit=unit;
  if(_recipePhotoData)food.photo=_recipePhotoData;
  const customs=lsG('custom_foods')||[];
  customs.push(food);lsS('custom_foods',customs);
  _recipePhotoData=null;
  const conf=document.getElementById('rc-conf');
  if(conf){conf.style.display='block';setTimeout(()=>{conf.style.display='none';},2000);}
  renderRecipes();
}
