<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<title>Gym v1.0</title>
</head>
<body>
<div id="warn-banner" class="warn-banner">Private mode detected &#x2014; data will NOT be saved</div>
<div class="hdr">
  <div class="hdr-toprow">
    <div class="ht">Gym</div>
    <div class="vtag" title="build 2026-08-31">v1.0</div>
  </div>
  <div class="hs" id="hsub">Loading...</div>
  <div class="mrow">
    <div class="met"><div class="mv" id="hdr-p-mv"><span class="hdricon">&#x26A1;</span> <span id="hdr-p">0g</span></div><div class="ml" id="hdr-p-lbl">/ 140g protein</div></div>
    <div class="met"><div class="mv" id="hdr-k-mv"><span class="hdricon">&#x1F525;</span> <span id="hdr-k">0</span></div><div class="ml" id="hdr-k-lbl">/ 2200 kcal</div></div>
    <div class="met"><div class="mv"><span class="hdricon">&#x2696;</span> <span id="hdr-wt" style="color:var(--grn)">&#x2014;</span></div><div class="ml">3wk avg wt</div></div>
  </div>
</div>
<div class="tabs">
  <button class="tab on" data-t="0">Today</button>
  <button class="tab" data-t="1">Cardio</button>
  <button class="tab" data-t="2">New</button>
  <button class="tab" data-t="3">Sleep</button>
  <button class="tab" data-t="4">Progress</button>
  <button class="tab" data-t="5">Profile</button>
  <button class="tab" data-t="6">Food</button>
  <button class="tab" data-t="7">History</button>
</div>
<div class="pnl on" id="p0"></div>
<div class="pnl" id="p1"></div>
<div class="pnl" id="p2"></div>
<div class="pnl" id="p3"></div>
<div class="pnl" id="p4"></div>
<div class="pnl" id="p5"></div>
<div class="pnl" id="p6"></div>
<div class="pnl" id="p7"></div>
<div class="sticky-wrap" id="sticky-wrap">
  <button class="sticky-save" id="sticky-btn">Log today’s workout</button>
</div>
<div id="save-toast" class="confbox" style="position:fixed;left:16px;right:16px;bottom:90px;z-index:50;display:none"></div>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(this)">
<script type="module" src="js/app.js"></script>
</body>
</html>
